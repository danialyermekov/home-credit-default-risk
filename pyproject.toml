[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "home-credit"
version = "0.1.0"
description = "End-to-end machine learning project for credit default risk prediction using the Home Credit dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "marimo>=0.23.16",
    "matplotlib>=3.11.1",
    "mlflow==3.15.1",
    "numpy>=2.0.0",
    "optuna>=4.9.0",
    "pandas>=2.2,<3",
    "plotly>=5.24.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/home_credit"]
